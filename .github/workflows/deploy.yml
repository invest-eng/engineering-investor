name: Objava obvestila (stara stran ni več objavljena)

# Stara stran od 10. 10. 2026 ni več objavljena (ARHIV.md). Na javni naslov gre samo obvestilo iz mape
# arhiv-obvestilo/. Koda strani ostane v repozitoriju in teče lokalno z "npm run dev".
# Za ponovno objavo cele strani vrni prejšnjo različico te datoteke iz zgodovine.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./arhiv-obvestilo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
